# MULCA + MUCA-Server as one Docker Swarm stack. Paste it into Swarmpit as-is.
#
# The images are built by each project's GitLab pipeline. Each service follows
# its branch's newest build: Swarmpit's autoredeploy label makes it check the
# registry and redeploy when that tag points at a new image. To pin or roll
# back, replace the branch tag with a commit tag from the registry.
version: "3.8"

services:
  muca-server:
    image: registry.gitlab.com/i3lab/muca/muca-server:gitlab-deployment
    environment:
      MUCA_LOG_LEVEL: INFO
    secrets:
      - source: muca_openai_api_key
        target: OPENAI_API_KEY
    volumes:
      - muca-data:/data
    networks:
      - muca
    # Only needed if clients outside the swarm (e.g. the Unity app) connect
    # to MUCA-Server directly. MULCA reaches it over the stack's network.
    # ports:
    #   - "8000:8000"
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      # muca-data is a volume on whichever node runs this service. If the
      # service is rescheduled onto another node, it starts there with an
      # empty database. Pin it to one node to keep conversation memory:
      # placement:
      #   constraints:
      #     - node.hostname == <node-name>

  mulca:
    image: registry.gitlab.com/i3lab/muca/mulca:gitlab-deployment
    environment:
      MUCA_SERVER_URL: ws://muca-server:8000/
    secrets:
      - source: mulca_discord_bot_token
        target: DISCORD_BOT_TOKEN
    networks:
      - muca
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"
      # Exactly one, and stop the old container before starting its
      # replacement: two processes on one bot token both answer every
      # message. The in-process singleton lock can't see across containers.
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

networks:
  muca:
    driver: overlay

volumes:
  muca-data:

# Create these once in Swarmpit (Secrets > New secret) before deploying.
secrets:
  muca_openai_api_key:
    external: true
  mulca_discord_bot_token:
    external: true
