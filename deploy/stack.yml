# MULCA + MUCA-Server as one Docker Swarm stack. Paste it into Swarmpit as-is.
#
# The images are built by each project's GitLab pipeline. Each service follows
# its branch's newest build: Swarmpit's autoredeploy label makes it check the
# registry and redeploy when that tag points at a new image. To pin or roll
# back, replace the branch tag with a commit tag from the registry.
version: "3.8"

services:
  muca-server:
    image: registry.gitlab.com/i3lab/muca/muca-server:gitlab-deployment
    environment:
      MUCA_LOG_LEVEL: INFO
      MUCA_SERVER_NAME: production
      # Posts to Discord every time the running total crosses another
      # cent; see usage_report.py. This is the one and only MUCA-Server
      # (replicas: 1 below), so its own total already is the
      # deployment-wide one -- no cross-server aggregation needed.
      # Deliberately noisy for now, to confirm live alerting actually
      # works end to end -- raise this (e.g. to "1") once confirmed.
      MUCA_COST_ALERT_THRESHOLD_STEP_USD: "0.01"
      # "ambient" (today's behavior, every turn judged) or "push_to_talk"
      # (intervention agent only judges inside a /listen-opened window --
      # see conversation.py). Left at "ambient" here on purpose: flip this
      # once local testing looks good, not as a side effect of this push.
      MUCA_LISTENING_MODE: "ambient"
      MUCA_PTT_SILENCE_MS: "5000"
    secrets:
      - source: muca_openai_api_key
        target: OPENAI_API_KEY
      - source: muca_admin_token
        target: MUCA_ADMIN_TOKEN
      - source: muca_cost_alert_webhook_url
        target: MUCA_COST_ALERT_WEBHOOK_URL
    volumes:
      - muca-data:/data
    networks:
      - muca
    # Only needed if clients outside the swarm (e.g. the Unity app) connect
    # to MUCA-Server directly. MULCA reaches it over the stack's network.
    # ports:
    #   - "8000:8000"
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      # muca-data is a volume on whichever node runs this service, so it
      # stays pinned to one node: rescheduled onto another, it would start
      # there with an empty database.
      placement:
        constraints:
          - node.hostname == i3lab

  mulca:
    image: registry.gitlab.com/i3lab/muca/mulca:gitlab-deployment
    environment:
      MUCA_SERVER_URL: ws://muca-server:8000/
    secrets:
      - source: mulca_discord_bot_token
        target: DISCORD_BOT_TOKEN
      - source: muca_admin_token
        target: MUCA_ADMIN_TOKEN
    # Links (/mulca link) and stopped bots, kept across redeploys. On i3lab,
    # like the service itself (see placement).
    volumes:
      - mulca-data:/data
    networks:
      - muca
    # On a redeploy the bot logs out and closes its sessions (MUCA-Server
    # saves each conversation) before the container is killed.
    stop_grace_period: 30s
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"
      # Exactly one, and stop the old container before starting its
      # replacement: two processes on one bot token both answer every
      # message. The in-process singleton lock can't see across containers.
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      # Not i3lab-vm-1, which also hosts the GitLab runner: the bot exited
      # there at startup without logging anything.
      placement:
        constraints:
          - node.hostname == i3lab

networks:
  muca:
    driver: overlay

volumes:
  muca-data:
  mulca-data:

# Create these once in Swarmpit (Secrets > New secret) before deploying.
secrets:
  muca_openai_api_key:
    external: true
  mulca_discord_bot_token:
    external: true
  # Shared by both services: /mulca model uses it to change MUCA-Server's model.
  muca_admin_token:
    external: true
  # A Discord channel webhook URL (Channel Settings > Integrations >
  # Webhooks); the $-threshold alerts from usage_report.py post there.
  muca_cost_alert_webhook_url:
    external: true
