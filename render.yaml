# Render Blueprint for Cadence online (free plan). Render deploys the branch
# gitlab-dev: this project plus a copy of muca-server in vendor/muca-server
# (deploy/render/update-vendor.sh refreshes the copy). Every merge into
# gitlab-dev is built and deployed by Render (autoDeploy).
# To create the service: Dashboard > New > Blueprint > repository G17-MULCA-Project.
# Secrets are never written here: Render asks for AZURE_OPENAI_API_KEY at
# creation (sync: false) and generates MUCA_ADMIN_TOKEN itself.
services:
  - type: web
    name: cadence-coordinator
    runtime: docker
    plan: free
    region: frankfurt
    branch: gitlab-dev
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AZURE_OPENAI_ENDPOINT
        value: https://g17-coordinator.openai.azure.com
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: MUCA_ADMIN_TOKEN
        generateValue: true
      # Keeps /data across restarts (deploy/render/snapshot.py): saved to one
      # file in Supabase Storage and restored at every start. Off until the
      # address is set. The values are set in Render, never written here.
      #   CADENCE_SNAPSHOT_URL     https://<project>.storage.supabase.co/storage/v1/s3/<bucket>/data.tar.gz
      #   CADENCE_SNAPSHOT_KEY_ID  S3 access key id (Supabase: Storage > S3)
      #   CADENCE_SNAPSHOT_SECRET  its secret access key
      #   CADENCE_SNAPSHOT_REGION  the region shown next to the S3 endpoint
      - key: CADENCE_SNAPSHOT_URL
        sync: false
      - key: CADENCE_SNAPSHOT_KEY_ID
        sync: false
      - key: CADENCE_SNAPSHOT_SECRET
        sync: false
      - key: CADENCE_SNAPSHOT_REGION
        sync: false
      - key: MUCA_COORDINATOR_ENABLED
        value: "true"
      - key: MUCA_COORDINATOR_CHECKIN_HOURS
        value: "24"
      - key: MUCA_COORDINATOR_MODEL
        value: gpt-6.1-sol
      - key: MUCA_SUMMARY_MODEL
        value: gpt-6-luna
      - key: MUCA_DAILY_SUMMARY_MODEL
        value: gpt-6-luna
      # The Vercel site that may call the API (production address).
      - key: MULCA_WEB_ALLOWED_ORIGINS
        value: https://cadence-group-coordinator.vercel.app
      # "Add Cadence to Discord / Slack" buttons (prototype/SLACK_SETUP.md,
      # TRYING_ON_DISCORD.md). Each one is optional: without it the web app
      # says that channel is not turned on. Secrets are set in Render only.
      - key: CADENCE_PUBLIC_URL
        value: https://cadence-coordinator.onrender.com
      - key: CADENCE_APP_URL
        value: https://cadence-group-coordinator.vercel.app
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
